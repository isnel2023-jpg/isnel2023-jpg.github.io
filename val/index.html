<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hablar con Val · Lion AI</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Kumbh+Sans:wght@300..700&display=swap">
<style>
:root{
  --ink:#0C0A09; --ink2:#151210; --ink3:#1F1A16;
  --bone:#F4F0E9; --mute:#8B8177; --line:rgba(240,205,128,.18);
  --oro:#F0CD80; --oro2:#C99A4E; --verde:#4FBF95; --rojo:#C4544A;
  --serif:'Instrument Serif',Georgia,serif;
  --ui:'Kumbh Sans',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--ink);color:var(--bone);font-family:var(--ui);font-weight:400;
  min-height:100svh;display:flex;align-items:center;justify-content:center;padding:20px;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
.aura{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aura i{position:absolute;border-radius:50%;filter:blur(100px);opacity:.32}
.aura i:nth-child(1){width:60vw;height:60vw;background:#7A5C2E;top:-22%;right:-16%}
.aura i:nth-child(2){width:44vw;height:44vw;background:#3A4A41;bottom:-18%;left:-12%}

.caja{position:relative;z-index:1;width:min(520px,100%);background:rgba(21,18,16,.86);
  backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:22px;
  padding:clamp(28px,5vw,44px);box-shadow:0 30px 90px rgba(0,0,0,.6)}

.marca{font-family:var(--serif);font-size:1.2rem;letter-spacing:.03em;color:var(--mute);margin-bottom:26px}
.marca b{color:var(--oro);font-weight:400}

/* orbe */
.orbe{width:132px;height:132px;margin:0 auto 26px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 34% 30%,#F5D89A,#C99A4E 46%,#6B4E24 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:2.9rem;color:#231A0C;
  transition:transform .5s cubic-bezier(.34,1.4,.5,1),box-shadow .5s}
.orbe::after,.orbe::before{content:'';position:absolute;inset:-10px;border-radius:50%;
  border:1.5px solid var(--oro);opacity:0}
.orbe.escucha{box-shadow:0 0 0 6px rgba(79,191,149,.14),0 0 60px rgba(79,191,149,.3)}
.orbe.habla{transform:scale(1.06);box-shadow:0 0 0 8px rgba(240,205,128,.16),0 0 80px rgba(240,205,128,.4)}
.orbe.habla::after{animation:onda 1.6s ease-out infinite}
.orbe.habla::before{animation:onda 1.6s ease-out .55s infinite}
@keyframes onda{0%{transform:scale(.95);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.orbe.marcando{animation:pulso 1.1s ease-in-out infinite}
@keyframes pulso{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.05);opacity:1}}

h1{font-family:var(--serif);font-size:clamp(1.9rem,5vw,2.5rem);font-weight:400;
  text-align:center;line-height:1.12;margin-bottom:12px}
h1 i{font-style:italic;color:var(--oro)}
.sub{text-align:center;color:var(--mute);font-size:.94rem;line-height:1.6;max-width:34ch;margin:0 auto}

.estado{text-align:center;margin:22px 0 6px;font-size:.8rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mute);min-height:20px;transition:color .3s}
.estado.on{color:var(--verde)}
.estado.err{color:var(--rojo);text-transform:none;letter-spacing:0;font-size:.86rem}
.cron{text-align:center;font-size:.82rem;color:var(--mute);font-variant-numeric:tabular-nums;min-height:20px}

.btns{display:flex;gap:12px;margin-top:26px}
button{flex:1;border:0;border-radius:99px;padding:17px;font:600 .82rem var(--ui);
  letter-spacing:.13em;text-transform:uppercase;cursor:pointer;
  transition:transform .22s cubic-bezier(.34,1.4,.5,1),box-shadow .25s,background .25s;
  position:relative;overflow:hidden}
button:active{transform:scale(.96)}
.llamar{background:linear-gradient(135deg,#F0CD80,#C99A4E);color:#1A1206}
.llamar:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(240,205,128,.34)}
.llamar:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.colgar{background:var(--rojo);color:#fff;display:none}
.colgar.on{display:block}
.colgar:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(196,84,74,.34)}

/* transcripción */
#tra{margin-top:22px;max-height:230px;overflow-y:auto;display:none;flex-direction:column;gap:9px;
  padding-right:4px}
#tra.on{display:flex}
#tra::-webkit-scrollbar{width:4px}
#tra::-webkit-scrollbar-thumb{background:var(--ink3);border-radius:2px}
.li{max-width:88%;padding:10px 14px;border-radius:14px;font-size:.88rem;line-height:1.5;
  animation:sube .3s ease}
@keyframes sube{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.li.val{background:rgba(240,205,128,.11);border:1px solid var(--line);align-self:flex-start;
  border-bottom-left-radius:4px}
.li.yo{background:rgba(79,191,149,.13);border:1px solid rgba(79,191,149,.25);align-self:flex-end;
  border-bottom-right-radius:4px}
.li .q{display:block;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;opacity:.5;margin-bottom:3px}

.pie{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);
  font-size:.74rem;color:var(--mute);line-height:1.65;text-align:center}
.pie b{color:var(--oro)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="aura"><i></i><i></i></div>

<div class="caja">
  <div class="marca">LION <b>AI</b> · Miami</div>

  <div class="orbe" id="orbe">V</div>

  <h1>Hable con <i>Val</i></h1>
  <p class="sub">Nuestra recepcionista de inteligencia artificial. Pregúntele lo que le preguntaría un cliente suyo — en español o en inglés.</p>

  <div class="estado" id="estado">Toque para llamar</div>
  <div class="cron" id="cron"></div>

  <div class="btns">
    <button class="llamar" id="btnLlamar">📞 Llamar a Val</button>
    <button class="colgar" id="btnColgar">Colgar</button>
  </div>

  <div id="tra"></div>

  <div class="pie">
    Esta llamada se graba. Val es una inteligencia artificial.<br>
    ¿Prefiere hablar con una persona? <b>+1 (346) 823-1378</b>
  </div>
</div>

<script type="module">
const WORKER='https://lion-ai.resonant-shroud-af6.workers.dev';
const orbe=document.getElementById('orbe'), estado=document.getElementById('estado'),
      cron=document.getElementById('cron'), tra=document.getElementById('tra'),
      bLlamar=document.getElementById('btnLlamar'), bColgar=document.getElementById('btnColgar');

let cliente=null, reloj=null, t0=0, ultimo='';

function di(txt,clase){ estado.textContent=txt; estado.className='estado'+(clase?' '+clase:''); }
function pintaTurnos(lista){
  if(!lista||!lista.length) return;
  const firma=JSON.stringify(lista.map(t=>t.role+':'+t.content));
  if(firma===ultimo) return;
  ultimo=firma;
  tra.innerHTML=''; tra.classList.add('on');
  lista.forEach(t=>{
    const esVal=(t.role==='agent');
    const d=document.createElement('div');
    d.className='li '+(esVal?'val':'yo');
    d.innerHTML='<span class="q">'+(esVal?'Val':'Usted')+'</span>';
    d.appendChild(document.createTextNode(t.content||''));
    tra.appendChild(d);
  });
  tra.scrollTop=tra.scrollHeight;
}
function arrancaReloj(){
  t0=Date.now();
  reloj=setInterval(()=>{
    const s=Math.floor((Date.now()-t0)/1000);
    cron.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  },1000);
}
function terminar(){
  clearInterval(reloj);
  orbe.className='orbe';
  bColgar.classList.remove('on');
  bLlamar.disabled=false; bLlamar.textContent='📞 Llamar otra vez';
  di('Llamada terminada');
}

bLlamar.onclick=async()=>{
  bLlamar.disabled=true;
  orbe.className='orbe marcando';
  di('Conectando…'); cron.textContent=''; tra.innerHTML=''; tra.classList.remove('on'); ultimo='';

  try{
    const r=await fetch(WORKER+'/webcall',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({negocio:'demo web'})});
    const d=await r.json();
    if(!d.access_token) throw new Error(d.detalle||d.error||'no se pudo abrir la llamada');

    const {RetellWebClient}=await import('https://esm.sh/retell-client-js-sdk@2');
    cliente=new RetellWebClient();

    cliente.on('call_started',()=>{
      orbe.className='orbe escucha';
      di('En llamada · le escucho','on');
      bColgar.classList.add('on');
      bLlamar.textContent='En llamada';
      arrancaReloj();
    });
    cliente.on('agent_start_talking',()=>{ orbe.className='orbe habla'; di('Val está hablando','on'); });
    cliente.on('agent_stop_talking',()=>{ orbe.className='orbe escucha'; di('Le escucho','on'); });
    cliente.on('update',u=>{ if(u&&u.transcript) pintaTurnos(u.transcript); });
    cliente.on('call_ended',terminar);
    cliente.on('error',e=>{ console.error(e); di('Se cortó la llamada','err'); terminar(); });

    await cliente.startCall({accessToken:d.access_token});
  }catch(e){
    console.error(e);
    orbe.className='orbe';
    di(String(e.message||e).slice(0,90),'err');
    bLlamar.disabled=false; bLlamar.textContent='📞 Intentar de nuevo';
  }
};

bColgar.onclick=()=>{ try{ cliente&&cliente.stopCall(); }catch(e){} terminar(); };
</script>
</body>
</html>
