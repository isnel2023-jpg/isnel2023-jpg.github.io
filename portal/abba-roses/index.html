<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self' https://lion-portal.lionsystems.workers.dev; worker-src 'self' blob:; base-uri 'none'; form-action 'self'; object-src 'none'">
<meta name="lion-portal" content="abba-roses">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Portal Lion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/portal/portal.css?v=20765140">
</head>
<body>

<!-- Entrada -->
<section id="login" class="login" hidden>
  <form id="loginForm" class="login-card" autocomplete="on">
    <div class="login-brand"><span class="lion-mark" aria-hidden="true">LION</span><span class="lbl">Lion Systems Group</span></div>
    <h1>Portal de colaboradores</h1>
    <p class="muted">Entra con tu contraseña personal.</p>
    <input type="text" name="username" autocomplete="username" value="colaborador" hidden aria-hidden="true">
    <div class="fld"><label for="pw">Contraseña</label><input id="pw" name="password" type="password" autocomplete="current-password" required minlength="6" maxlength="200"></div>
    <button class="btn pri" type="submit" id="loginBtn">Entrar</button>
    <p class="login-err" id="loginErr" role="alert"></p>
  </form>
</section>

<!-- Panel del administrador -->
<section id="adminApp" hidden></section>

<!-- Portal del colaborador (igual al original) -->
<section id="portalApp" hidden>
<div id="adminBar" class="adminbar" hidden></div>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <span class="lbl">Lion Systems Group</span>
      <h1 id="ptTitle">Portal</h1>
      <span class="muted" id="ptWho" style="font-size:.85rem"></span>
    </div>
    <div class="clock">
      <div><div class="lbl" id="tzLbl">Hora</div><div class="t" id="clk">--:--</div></div>
      <div class="shift">
        <span class="pill" id="shiftPill"><span class="dot"></span><span id="shiftTxt">Fuera de turno</span></span>
        <button class="btn pri" id="shiftBtn" type="button">Empezar turno</button>
      </div>
      <button class="btn sm ghost" id="logoutBtn" type="button" title="Salir">Salir</button>
    </div>
  </div>
  <div class="wrap"><nav class="tabs" role="tablist" id="tabs"></nav></div>
</header>
<main><div class="wrap" id="view"><div class="empty">Cargando tu información…</div></div></main>
<div id="layer"></div>
</section>

<script src="/portal/vendor/Sortable.min.js"></script>
<script src="/portal/config.js"></script>
<script src="/portal/shim.js?v=20765140"></script>
<script src="/portal/app.js?v=20765140"></script>
<script src="/portal/admin.js?v=20765140"></script>
<script src="/portal/boot.js?v=20765140"></script>
</body>
</html>
